<div class="card">
    <div class="card-body">
        <p class="card-text text-start">
            {% if tool.logo %}
            <a href="{{ tool.docs }}"><img
                    src="assets/{{ tool.logo }}"
                    alt="{{ tool.name }} logo"
                    height="50"/></a>
            {% else %}
            <a href="{{ tool.docs }}"><b>{{ tool.name }}</b></a>
            {% endif %}
            <a href="https://www.repostatus.org/#active"><img
                    src="https://www.repostatus.org/badges/latest/active.svg"
                    alt="Project Status: Active – The project has reached a stable, usable state and is being actively developed."/></a>
            <a href="https://github.com/seroanalytics/{{ tool.gh_repo }}"><img
                    alt="GitHub last commit"
                    src="https://img.shields.io/github/last-commit/seroanalytics/{{ tool.gh_repo }}"></a>
        </p>
        <p class="card-text text-start">
            {{ tool.description }}
        </p>
        {% if tool.docs %}
        <a href="{{ tool.docs }}"
           target="_blank">{{ tool.docs }}</a> (docs)<br/>
        {% endif %}
        {% if tool.web %}
        <a href="{{ tool.web }}"
           target="_blank">{{ tool.web }}</a> (web app)
        {% endif %}
    </div>
</div>
