<div class="card">
    <div class="card-body">
        <p class="card-text text-start">
            {% if tool.logo %}
            <a href="{{ tool.docs | default: tool.web }}"><img
                    src="assets/{{ tool.logo }}"
                    alt="{{ tool.name }} logo"
                    height="50"/></a>
            {% else %}
            <a href="{{ tool.docs | default: tool.web }}"><b>{{ tool.name }}</b></a>
            {% endif %}
            <a href="https://www.repostatus.org/#active"><img
                    src="https://www.repostatus.org/badges/latest/active.svg"
                    alt="Project Status: Active – The project has reached a stable, usable state and is being actively developed."/></a>
            {% if tool.external %}
            <a href="{{ tool.gh_repo }}"><img
                    alt="GitHub last commit"
                    src="https://img.shields.io/github/last-commit/{{ tool.gh_repo | replace: 'https://github.com/', '' }}"></a>
            {% else %}
            <a href="https://github.com/seroanalytics/{{ tool.gh_repo }}"><img
                    alt="GitHub last commit"
                    src="https://img.shields.io/github/last-commit/seroanalytics/{{ tool.gh_repo }}"></a>
            {% endif %}
        </p>
        <p class="card-text text-start">
            {{ tool.description }}
        </p>
        <div class="tool-links">
            {% if tool.docs %}
            <a href="{{ tool.docs }}" class="tool-link" target="_blank">
                <i class="fas fa-book"></i>
                Documentation
            </a>
            {% endif %}
            {% if tool.web %}
            <a href="{{ tool.web }}" class="tool-link" target="_blank">
                <i class="fas fa-external-link-alt"></i>
                Web App
            </a>
            {% endif %}
            {% if tool.external %}
            <a href="{{ tool.gh_repo }}" class="tool-link" target="_blank">
                <i class="fab fa-github"></i>
                GitHub
            </a>
            {% else %}
            <a href="https://github.com/seroanalytics/{{ tool.gh_repo }}" class="tool-link" target="_blank">
                <i class="fab fa-github"></i>
                GitHub
            </a>
            {% endif %}
        </div>
    </div>
</div>
