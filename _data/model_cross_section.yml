- name: "Rsero"
  description: "Rsero is an R package to estimate the annual force of infection using serological data. It provides tools for analyzing cross-sectional serological surveys and fitting serocatalytic models."
  docs: "https://htmlpreview.github.io/?https://github.com/nathoze/Rsero/blob/master/vignettes/models.html"
  gh_repo: "https://github.com/nathoze/Rsero"
  doi: "https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1012777"
  category: "cross-section"
  external: true
  last_commit: "2024-09-10"
  r_check: true

- name: "serofoi"
  description: "serofoi is an R package to estimate the Force-of-Infection (FoI) of a given pathogen from age-disaggregated population-based cross-sectional serosurveys, using a Bayesian framework. Part of the Epiverse Initiative."
  docs: "https://epiverse-trace.github.io/serofoi/"
  gh_repo: "https://github.com/epiverse-trace/serofoi"
  category: "cross-section"
  external: true
  last_commit: "2024-12-05"
  r_check: true
  logo: "serofoi.png"

- name: "serosv"
  description: "serosv is an easy-to-use and efficient tool to estimate infectious diseases parameters (seroprevalence and force of infection) using serological data."
  docs: "https://oucru-modelling.github.io/serosv/index.html"
  gh_repo: "https://github.com/OUCRU-Modelling/serosv"
  category: "cross-section"
  external: true
  last_commit: "2024-04-01"
  r_check: true
  logo: "serosv.png"

- name: "serocalculator"
  description: "Provides a rapid and computationally simple method for calculating seroconversion rates"
  docs: "https://ucd-serg.github.io/serocalculator/articles/serocalculator.html"
  gh_repo: "https://github.com/UCD-SERG/serocalculator"
